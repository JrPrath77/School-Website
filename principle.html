  <script>
    document.getElementById('principal-message-text').innerHTML = `
      <p><strong>\u092A\u094D\u0930\u093F\u092F \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u094B \u0906\u0923\u093F \u092A\u093E\u0932\u0915\u093E\u0902\u0928\u094B,</strong></p>
      <p>\u0928\u092E\u0938\u094D\u0915\u093E\u0930!</p>
      <p>\u0906\u092A\u0923 \u0938\u0930\u094D\u0935\u091C\u0923 \u0906\u0928\u0902\u0926\u0940, \u0928\u093F\u0930\u094B\u0917\u0940 \u0906\u0923\u093F \u0909\u0924\u094D\u0938\u093E\u0939\u0940 \u0905\u0938\u093E\u0932, \u0905\u0936\u0940 \u092E\u0928\u093E\u092A\u093E\u0938\u0942\u0928 \u0906\u0936\u093E \u0906\u0939\u0947. \u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u0935\u0930\u094D\u0937\u093E\u091A\u093E \u0939\u093E \u092E\u0939\u0924\u094D\u0924\u094D\u0935\u093E\u091A\u093E \u091F\u092A\u094D\u092A\u093E \u092A\u093E\u0930 \u0915\u0930\u0924 \u0905\u0938\u0924\u093E\u0928\u093E, \u0906\u092A\u0932\u094D\u092F\u093E \u0936\u093E\u0933\u0947\u091A\u094D\u092F\u093E \u092E\u0942\u0932\u094D\u092F\u093E\u0902\u0928\u093E \u0906\u0923\u093F \u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u091C\u092C\u093E\u092C\u0926\u093E\u0931\u094D\u092F\u093E\u0902\u0928\u093E \u092A\u094D\u0930\u093E\u0927\u093E\u0928\u094D\u092F \u0926\u0947\u0923\u0947 \u0917\u0930\u091C\u0947\u091A\u0947 \u0906\u0939\u0947, \u092F\u093E\u091A\u0940 \u0906\u0920\u0935\u0923 \u0915\u0930\u0942\u0928 \u0926\u094D\u092F\u093E\u0935\u0940\u0936\u0940 \u0935\u093E\u091F\u0924\u0947.</p>
      <p>\u092E\u093E\u0917\u0940\u0932 \u0915\u093E\u0939\u0940 \u092E\u0939\u093F\u0928\u094D\u092F\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u0906\u092A\u0923 \u0905\u0928\u0947\u0915 \u092F\u0936 \u092E\u093F\u0933\u0935\u0932\u0940 \u0906\u0923\u093F \u0915\u093E\u0939\u0940 \u0906\u0935\u094D\u0939\u093E\u0928\u093E\u0902\u0935\u0930 \u092F\u0936\u0938\u094D\u0935\u0940\u092A\u0923\u0947 \u092E\u093E\u0924 \u0915\u0947\u0932\u0940. \u0906\u092A\u0932\u094D\u092F\u093E \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u0940 \u0926\u093E\u0916\u0935\u0932\u0947\u0932\u0940 \u091A\u093F\u0915\u093E\u091F\u0940, \u0938\u092E\u091C\u0942\u0924\u0926\u093E\u0930\u092A\u0923\u093E \u0906\u0923\u093F \u092C\u0926\u0932\u093E\u0936\u0940 \u091C\u0941\u0933\u0935\u0942\u0928 \u0918\u0947\u0923\u094D\u092F\u093E\u091A\u0940 \u0915\u094D\u0937\u092E\u0924\u093E \u0916\u0930\u094B\u0916\u0930\u091A \u0915\u094C\u0924\u0941\u0915\u093E\u0938\u094D\u092A\u0926 \u0906\u0939\u0947. \u0939\u0947 \u0906\u092A\u0932\u094D\u092F\u093E \u0936\u093E\u0933\u0947\u0924\u0940\u0932 \u0938\u094D\u0928\u0947\u0939\u092A\u0942\u0930\u094D\u0923 \u0906\u0923\u093F \u092A\u094D\u0930\u094B\u0924\u094D\u0938\u093E\u0939\u0928\u093E\u0924\u094D\u092E\u0915 \u0935\u093E\u0924\u093E\u0935\u0930\u0923\u093E\u092E\u0941\u0933\u0947 \u0936\u0915\u094D\u092F \u091D\u093E\u0932\u0947 \u0906\u0939\u0947.</p>
      <p>\u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u0935\u0930\u094D\u0937\u093E\u091A\u093E \u0939\u093E \u091F\u092A\u094D\u092A\u093E \u0938\u0902\u092A\u0924 \u0906\u0932\u093E \u0906\u0939\u0947 \u0906\u0923\u093F \u092F\u093E \u092A\u094D\u0930\u0935\u093E\u0938\u093E\u0915\u0921\u0947 \u092A\u093E\u0939\u0924\u093E\u0928\u093E \u092E\u0928 \u0905\u092D\u093F\u092E\u093E\u0928\u093E\u0928\u0947 \u092D\u0930\u0942\u0928 \u092F\u0947\u0924\u0947. \u0906\u092A\u0932\u094D\u092F\u093E \u0938\u0930\u094D\u0935\u093E\u0902\u091A\u094D\u092F\u093E \u090F\u0915\u0924\u094D\u0930\u093F\u0924 \u092A\u094D\u0930\u092F\u0924\u094D\u0928\u093E\u0902\u092E\u0941\u0933\u0947 \u090F\u0915 \u0905\u0936\u0940 \u0936\u093E\u0933\u093E \u0924\u092F\u093E\u0930 \u091D\u093E\u0932\u0940 \u0906\u0939\u0947 \u091C\u093F\u0925\u0947 \u092A\u094D\u0930\u0924\u094D\u092F\u0947\u0915 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0906\u0924\u094D\u092E\u0935\u093F\u0936\u094D\u0935\u093E\u0938\u093E\u0928\u0947 \u0936\u093F\u0915\u0924\u094B, \u0935\u093E\u0922\u0924\u094B \u0906\u0923\u093F \u0938\u094D\u0935\u0924\u0903\u091A\u0940 \u0916\u0930\u0940 \u0915\u094D\u0937\u092E\u0924\u093E \u0913\u0933\u0916\u0924\u094B.
\u0906\u092A\u0932\u094D\u092F\u093E \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u0940 \u0935\u093F\u0935\u093F\u0927 \u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u0909\u0924\u094D\u0915\u0943\u0937\u094D\u091F \u0915\u093E\u092E\u0917\u093F\u0930\u0940 \u0915\u0947\u0932\u0940 \u0906\u0939\u0947. \u0906\u0902\u0924\u0930\u0936\u093E\u0932\u0947\u092F \u0938\u094D\u092A\u0930\u094D\u0927\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u092D\u093E\u0917 \u0918\u0947\u0909\u0928 \u0936\u093E\u0933\u0947\u091A\u0902 \u0928\u093E\u0935 \u0909\u091C\u094D\u0935\u0932 \u0915\u0947\u0932\u0902 \u0906\u0939\u0947. \u0915\u094D\u0930\u0940\u0921\u093E, \u0915\u0932\u093E, \u0935\u093F\u091C\u094D\u091E\u093E\u0928, \u0935\u093E\u091A\u0928 \u0906\u0923\u093F \u0907\u0924\u0930 \u0905\u0928\u0947\u0915 \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u0924\u094D\u092F\u093E\u0902\u0928\u0940 \u0906\u092A\u0932\u0940 \u0915\u094C\u0936\u0932\u094D\u092F\u0902 \u0926\u093E\u0916\u0935\u0932\u0940 \u0906\u0939\u0947\u0924.
\u0928\u0935\u0940\u0928 \u0938\u0902\u0935\u093E\u0926\u093E\u0924\u094D\u092E\u0915 \u0906\u0923\u093F \u0938\u0939\u092D\u093E\u0917\u0940 \u0936\u093F\u0915\u094D\u0937\u0923 \u092A\u0926\u094D\u0927\u0924\u0940\u0902\u092E\u0941\u0933\u0947 \u092E\u0941\u0932\u093E\u0902\u091A\u0947 \u0936\u093F\u0915\u0923\u094D\u092F\u093E\u0924\u0940\u0932 \u0938\u0939\u092D\u093E\u0917 \u0935\u093E\u0922\u0932\u093E \u0906\u0939\u0947. \u0915\u0920\u0940\u0923 \u0938\u0902\u0915\u0932\u094D\u092A\u0928\u093E\u0939\u0940 \u0906\u0924\u093E \u0924\u094D\u092F\u093E\u0902\u0928\u093E \u0938\u0939\u091C \u0938\u092E\u091C\u0924 \u0906\u0939\u0947\u0924. \u092F\u093E\u092E\u0941\u0933\u0947 \u0924\u094D\u092F\u093E\u0902\u091A\u093E \u0906\u0924\u094D\u092E\u0935\u093F\u0936\u094D\u0935\u093E\u0938 \u0935\u093E\u0922\u0932\u093E \u0906\u0939\u0947.</p>
      <p>\u092F\u093E\u091A\u092C\u0930\u094B\u092C\u0930, \u0938\u092E\u093E\u091C\u0938\u0947\u0935\u0947\u0936\u0940 \u091C\u094B\u0921\u0932\u0947\u0932\u0947 \u092A\u094D\u0930\u0915\u0932\u094D\u092A\u0939\u0940 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u0940 \u092E\u094B\u0920\u094D\u092F\u093E \u0909\u0924\u094D\u0938\u093E\u0939\u093E\u0928\u0947 \u092A\u0942\u0930\u094D\u0923 \u0915\u0947\u0932\u0947 \u0906\u0939\u0947\u0924. \u0924\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u0924\u094D\u092F\u093E\u0902\u091A\u094D\u092F\u093E \u092E\u0928\u093E\u0924 \u0907\u0924\u0930\u093E\u0902\u092C\u0926\u094D\u0926\u0932 \u0938\u0939\u0935\u0947\u0926\u0928\u093E, \u091C\u092C\u093E\u092C\u0926\u093E\u0930\u0940 \u0906\u0923\u093F \u0938\u0947\u0935\u093E\u092D\u093E\u0935 \u0928\u093F\u0930\u094D\u092E\u093E\u0923 \u091D\u093E\u0932\u093E \u0906\u0939\u0947. \u0915\u0947\u0935\u0933 \u0905\u092D\u094D\u092F\u093E\u0938\u091A \u0928\u0935\u094D\u0939\u0947, \u0924\u0930 \u091A\u093E\u0902\u0917\u0932\u0947 \u092E\u093E\u0923\u0942\u0938 \u0918\u0921\u0935\u0923\u0947 \u0939\u093E\u0939\u0940 \u0906\u092A\u0932\u094D\u092F\u093E \u0936\u093E\u0933\u0947\u091A\u093E \u0909\u0926\u094D\u0926\u0947\u0936 \u0906\u0939\u0947.
\u0939\u0940 \u092F\u0936\u0902 \u0915\u0947\u0935\u0933 \u091F\u092A\u094D\u092A\u094D\u092F\u093E\u0902\u091A\u0940 \u0928\u094B\u0902\u0926 \u0928\u0938\u0942\u0928, \u092D\u0935\u093F\u0937\u094D\u092F\u093E\u0924\u0940\u0932 \u0928\u0935\u094D\u092F\u093E \u092A\u094D\u0930\u0935\u093E\u0938\u093E\u0938\u093E\u0920\u0940\u091A\u0940 \u092A\u093E\u092F\u0930\u0940 \u0906\u0939\u0947\u0924. \u092F\u093E \u0938\u0930\u094D\u0935 \u0918\u0921\u093E\u092E\u094B\u0921\u0940 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u093E \u092A\u094D\u0930\u0947\u0930\u0923\u093E \u0926\u0947\u0924\u0940\u0932 \u0906\u0923\u093F \u0906\u092A\u0932\u094D\u092F\u093E \u0938\u0930\u094D\u0935\u093E\u0902\u0917\u0940\u0923 \u0936\u093F\u0915\u094D\u0937\u0923\u093E\u091A\u094D\u092F\u093E \u0938\u0902\u0915\u0932\u094D\u092A\u0928\u0947\u0932\u093E \u0905\u0927\u093F\u0915 \u092C\u0933 \u092E\u093F\u0933\u0947\u0932.
\u0906\u092A\u0932\u094D\u092F\u093E \u0938\u0924\u0924\u091A\u094D\u092F\u093E \u0938\u0939\u0915\u093E\u0930\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u0906\u0923\u093F \u0935\u093F\u0936\u094D\u0935\u093E\u0938\u093E\u092E\u0941\u0933\u0947\u091A \u0939\u0947 \u0938\u0930\u094D\u0935 \u0936\u0915\u094D\u092F \u091D\u093E\u0932\u0947 \u0906\u0939\u0947. \u092A\u0941\u0922\u0940\u0932 \u0915\u093E\u0933\u093E\u0924\u0939\u0940 \u0906\u092A\u0923 \u090F\u0915\u0924\u094D\u0930 \u092E\u093F\u0933\u0942\u0928 \u0936\u093E\u0933\u0947\u0932\u093E \u092F\u0936\u093E\u091A\u094D\u092F\u093E \u0906\u0923\u0916\u0940 \u0909\u0902\u091A\u0940\u0935\u0930 \u0928\u0947\u0909.</p>
      <p><strong>\u0906\u092A\u0923 \u0939\u0947 \u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u0935\u0930\u094D\u0937 \u0905\u0930\u094D\u0925\u092A\u0942\u0930\u094D\u0923, \u0906\u0928\u0902\u0926\u0926\u093E\u092F\u0940 \u0906\u0923\u093F \u092F\u0936\u0938\u094D\u0935\u0940 \u0915\u0930\u0942 \u2013 \u092F\u093E\u091A\u0940 \u092E\u0932\u093E \u092A\u0942\u0930\u094D\u0923 \u0916\u093E\u0924\u094D\u0930\u0940 \u0906\u0939\u0947.</strong></p>
      <p>\u0906\u092A\u0932\u094D\u092F\u093E \u0935\u093F\u0936\u094D\u0935\u093E\u0938\u093E\u092C\u0926\u094D\u0926\u0932 \u0906\u0923\u093F \u0938\u093E\u0925\u0940\u0938\u093E\u0920\u0940 \u092E\u0928\u093E\u092A\u093E\u0938\u0942\u0928 \u0927\u0928\u094D\u092F\u0935\u093E\u0926.</p>
      <p>\u0906\u092A\u0932\u093E \u0928\u092E\u094D\u0930, <br>
      \u0938\u092E\u0940\u0930 \u092A\u0920\u093E\u0923<br><strong>\u092E\u0941\u0916\u094D\u092F\u093E\u0927\u094D\u092F\u093E\u092A\u0915, DAGA \u0936\u093E\u0933\u093E</strong></p>
    `;
  </script>

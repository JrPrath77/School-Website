<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>प्रवेश अर्ज — DAGA Education</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Baloo+2:wght@400..800&family=Noto+Sans+Devanagari:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/programs.css">
  <link rel="stylesheet" href="styles/about.css">
  <link rel="stylesheet" href="styles/news.css">
  <link rel="stylesheet" href="styles/testimonials.css">
  <link rel="stylesheet" href="styles/contact.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/founder.css">
  <link rel="stylesheet" href="styles/staff.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/dark-mode.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/lightbox.css">
  <link rel="stylesheet" href="styles/announcement-toast.css">
</head>
<body>
  <!-- Header (injected by shared-header.js) -->
  <header id="header" class="header"></header>

  <!-- Banner Section -->
  <section class="staff-hero-banner">
    <div class="staff-hero-overlay"></div>
    <img src="images/founder-banner.jpg" alt="Founder Background" class="staff-bg-image">
    <div class="staff-hero-content">
      <h1 class="staff-heading">Apply Now</h1>
      <p class="staff-quote">"प्रवेश हा केवळ सुरुवात आहे, घडवायचंय उज्वल भविष्य!"</p>
    </div>
  </section>

  <!-- Form Section -->
  <div class="contact-form-wrapper">
    <div class="contact-form-container">
      <form class="contact-form" id="admissionForm">
        <h3 style="font-family:'Baloo 2','Noto Sans Devanagari',sans-serif; margin-bottom:24px;">प्रवेश अर्ज</h3>

        <div class="form-group">
          <label for="adm_name">विद्यार्थ्याचे पूर्ण नाव *</label>
          <input type="text" id="adm_name" name="name" required placeholder="उदा. राहुल शर्मा">
        </div>

        <div class="form-group">
          <label for="adm_phone">फोन नंबर *</label>
          <input type="tel" id="adm_phone" name="phone" required placeholder="उदा. 9876543210">
        </div>

        <div class="form-group">
          <label for="adm_email">ईमेल पत्ता</label>
          <input type="email" id="adm_email" name="email" placeholder="yourname@example.com">
        </div>

        <div class="form-group">
          <label for="adm_pschool">मागील शाळेचे नाव</label>
          <input type="text" id="adm_pschool" name="pschool" placeholder="उदा. ज्ञानदीप विद्यालय">
        </div>

        <div class="form-group">
          <label for="adm_standard">इयत्ता (कोणत्या वर्गासाठी प्रवेश हवा)</label>
          <input type="text" id="adm_standard" name="standard" placeholder="उदा. ७ वी">
        </div>

        <div class="form-group">
          <label for="adm_message">अतिरिक्त माहिती / प्रश्न</label>
          <textarea id="adm_message" name="message" rows="3" placeholder="काही विचारायचे असल्यास येथे लिहा..."></textarea>
        </div>

        <button type="submit" class="primary-btn" id="submitBtn" style="font-family:'Baloo 2','Noto Sans Devanagari',sans-serif; width:100%; font-size:1.05rem;">अर्ज पाठवा</button>
      </form>
    </div>
  </div>

  <!-- Marathi Success Modal -->
  <div id="admissionSuccessModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:20px; padding:40px 32px; max-width:420px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3); font-family:'Baloo 2','Noto Sans Devanagari',sans-serif;">
      <div style="font-size:56px; margin-bottom:16px;">✅</div>
      <h2 style="color:#1a1a2e; font-size:1.5rem; margin-bottom:12px;">धन्यवाद!</h2>
      <p style="color:#374151; font-size:1.05rem; line-height:1.7; margin-bottom:24px;">
        आपला प्रवेश अर्ज यशस्वीरित्या प्राप्त झाला आहे.<br>
        आमचे कर्मचारी लवकरच आपल्याशी संपर्क करतील.
      </p>
      <button onclick="document.getElementById('admissionSuccessModal').style.display='none'"
        style="background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; border:none; padding:12px 32px; border-radius:30px; font-size:1rem; font-weight:700; cursor:pointer; font-family:inherit;">
        ठीक आहे
      </button>
    </div>
  </div>

  <!-- Footer (injected by shared-footer.js) -->
  <footer class="footer"></footer>

  <!-- Chat Widget -->
  <div class="chat-widget" id="chat-widget">
    <button class="chat-toggle" id="chat-toggle">
      <span class="chat-toggle-icon">💬</span>
      <span class="chat-toggle-text">Need Help?</span>
    </button>
    <div class="chat-container" id="chat-container">
      <div class="chat-header">
        <h3>DAGA Education Assistant</h3>
        <button class="chat-close" id="chat-close">×</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message bot">
          <div class="message-content">Hello! I'm your DAGA Education assistant. How can I help you today?</div>
        </div>
      </div>
      <div class="chat-input">
        <textarea id="chat-input-field" placeholder="Type your message..." rows="1"></textarea>
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

  <script src="js/shared-header.js"></script>
  <script src="js/shared-footer.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/scroll-reveal.js"></script>
  <script src="js/config.js"></script>
  <script src="js/announcement.js"></script>
  <script src="js/announcement-toast.js"></script>
  <script src="js/chat.js"></script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>
  // ── EmailJS Config (fill these in after creating your EmailJS account) ──────
  const EMAILJS_PUBLIC_KEY  = 'YOUR_EMAILJS_PUBLIC_KEY';   // From EmailJS → Account → Keys
  const EMAILJS_SERVICE_ID  = 'YOUR_SERVICE_ID';           // From EmailJS → Email Services
  const EMAILJS_TEMPLATE_ID = 'YOUR_TEMPLATE_ID';          // From EmailJS → Email Templates
  // ────────────────────────────────────────────────────────────────────────────

  const API_BASE = window.SITE_CONFIG.API_BASE;

  // Initialize EmailJS
  if (EMAILJS_PUBLIC_KEY !== 'YOUR_EMAILJS_PUBLIC_KEY') {
    emailjs.init(EMAILJS_PUBLIC_KEY);
  }

  document.getElementById('admissionForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'पाठवत आहे...';

    const name       = document.getElementById('adm_name').value.trim();
    const phone      = document.getElementById('adm_phone').value.trim();
    const email      = document.getElementById('adm_email').value.trim();
    const pschool    = document.getElementById('adm_pschool').value.trim();
    const standard   = document.getElementById('adm_standard').value.trim();
    const message    = document.getElementById('adm_message').value.trim();

    // ── Step 1: Save to Backend DB (Admin Dashboard) ─────────────────────────
    let savedToDB = false;
    try {
      const res = await fetch(`${API_BASE}/api/v1/enquiries`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, email, previousSchool: pschool, standard, message }),
      });

      if (res.ok) {
        savedToDB = true;
      } else {
        const err = await res.json();
        console.error('Backend error:', err.message);
      }
    } catch (err) {
      console.error('Could not reach backend:', err);
    }

    // ── Step 2: Send Email via EmailJS ────────────────────────────────────────
    if (EMAILJS_PUBLIC_KEY !== 'YOUR_EMAILJS_PUBLIC_KEY') {
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          from_name:     name,
          phone:         phone,
          reply_to:      email || 'N/A',
          previous_school: pschool || 'N/A',
          standard:      standard || 'N/A',
          message:       message || 'N/A',
        });
      } catch (emailErr) {
        // Email failed but we still show success — DB is the source of truth
        console.error('EmailJS error (non-fatal):', emailErr);
      }
    }

    // ── Step 3: Show Marathi Success Modal ────────────────────────────────────
    document.getElementById('admissionSuccessModal').style.display = 'flex';
    document.getElementById('admissionForm').reset();
    btn.disabled = false;
    btn.textContent = 'अर्ज पाठवा';
  });
  </script>

</body>
</html>

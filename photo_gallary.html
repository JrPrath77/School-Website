<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAGA Education</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/programs.css">
  <link rel="stylesheet" href="styles/about.css">
  <link rel="stylesheet" href="styles/news.css">
  <link rel="stylesheet" href="styles/testimonials.css">
  <link rel="stylesheet" href="styles/contact.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/staff.css">
  <link rel="stylesheet" href="styles/photo_gallary.css">
  <link rel="stylesheet" href="styles/video_gallary.css">
  <link rel="stylesheet" href="styles/dynamic-content.css">
    <!--favicon-->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles/dark-mode.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/lightbox.css">
  <link rel="stylesheet" href="styles/announcement-toast.css">
  <script src="js/config.js"></script>
</head>
<body>
  <!-- Header -->
  <!-- Header (injected by shared-header.js) -->
  <header id="header" class="header"></header>

<!-- Gallary section start here -->
<!-- Page Banner -->
  <section class="photo-banner">
    <div class="photo-banner-overlay"></div>
    <img src="images/photogallary-banner.png" alt="Photo Gallery Background" class="photo-banner-bg">
    <div class="container banner-content">
      <h1>Photo Gallery</h1>
      <p>Capturing moments that define our journey of excellence</p>
    </div>
  </section>

  <!-- Squared Image Gallery -->
  <section class="square-gallery">
    <div class="container">
      <div class="section-header">
        <h2>School Life</h2>
        <p>Explore the diverse aspects of our educational journey</p>
      </div>

      <div class="gallery-filter">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="academics">Academics</button>
        <button class="filter-btn" data-filter="sports">Sports</button>
        <button class="filter-btn" data-filter="arts">Arts & Culture</button>
        <button class="filter-btn" data-filter="events">Events</button>
      </div>
      
      <div class="gallery-grid">
        <!-- Dynamic content will be injected by js/gallery-api.js -->
    </div>
  </section>

  <!-- Read More Modal -->
  <div class="modal" id="readMoreModal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div class="modal-body">
        <div class="modal-image">
          <img src="" alt="Gallery image" id="modalImage">
        </div>
        <div class="modal-text">
          <h2 id="modalTitle"></h2>
          <p id="modalDate"></p>
          <div id="modalDescription"></div>
        </div>
      </div>
    </div>
  </div>

  
<!-- Footer -->
  <!-- Footer (injected by shared-footer.js) -->
  <footer class="footer"></footer>

  <!-- Chat Widget -->
  <div class="chat-widget" id="chat-widget">
    <button class="chat-toggle" id="chat-toggle">
      <span class="chat-toggle-icon">💬</span>
      <span class="chat-toggle-text">Need Help?</span>
    </button>
    <div class="chat-container" id="chat-container">
      <div class="chat-header">
        <h3>DAGA Education Assistant</h3>
        <button class="chat-close" id="chat-close">×</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message bot">
          <div class="message-content">
            Hello! I'm your DAGA Education assistant. How can I help you today?
          </div>
        </div>
      </div>
      <div class="chat-input">
        <textarea 
          id="chat-input-field" 
          placeholder="Type your message..."
          rows="1"
        ></textarea>
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script src="js/slider.js"></script>
  <script src="js/testimonials.js"></script>
  <script src="js/programs.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/gallary.js"></script>
  <script src="js/gallery-api.js"></script>

  <!-- Announcement Toast Popup -->
  <div id="announcement-toast" class="announcement-toast">
    <div class="toast-header">
      <span class="toast-title">📢 Announcement</span>
      <button id="toast-close" class="toast-close" aria-label="Close">×</button>
    </div>
    <p class="toast-date" id="toast-date"></p>
    <p class="toast-notice-title" id="toast-notice-title"></p>
    <p class="toast-text" id="toast-text"></p>
    <div class="toast-footer">
      <a id="toast-link" class="toast-link" href="#" style="display:none;">Read more →</a>
    </div>
    <div class="toast-progress"><div class="toast-progress-bar"></div></div>
  </div>

  <!-- Shared Components -->
  <script src="js/shared-header.js"></script>
  <script src="js/shared-footer.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/scroll-reveal.js"></script>
  <script src="js/announcement.js"></script>
  <script src="js/announcement-toast.js"></script>
  <script src="js/lightbox.js"></script>
</body>
</html>

  <script>
    document.getElementById('founder-message-text').innerHTML = `
      <p><strong>\u092A\u094D\u0930\u093F\u092F \u092A\u093E\u0932\u0915 \u092C\u0902\u0927\u0941-\u092D\u0917\u093F\u0928\u0940\u0928\u094B,</strong></p>
      <p>\u0915\u094B\u0930\u094B\u0928\u093E \u092E\u0939\u093E\u092E\u093E\u0930\u0940\u092E\u0941\u0933\u0947 \u0911\u0928\u0932\u093E\u0908\u0928 \u0936\u093F\u0915\u094D\u0937\u0923 \u092E\u094B\u092C\u093E\u0908\u0932\u0935\u0930 \u0938\u0941\u0930\u0942 \u091D\u093E\u0932\u0947 \u0939\u094B\u0924\u0947. \u0911\u0928\u0932\u093E\u0908\u0928 \u0915\u094D\u0932\u093E\u0938 \u0938\u0902\u092A\u0932\u094D\u092F\u093E\u0928\u0902\u0924\u0930\u0939\u0940 \u092E\u0941\u0932\u093E\u0902\u091A\u094D\u092F\u093E \u0939\u093E\u0924\u093E\u0924 \u091C\u093E\u0938\u094D\u0924 \u0915\u093E\u0933 \u092E\u094B\u092C\u093E\u0908\u0932 \u0930\u093E\u0939\u093F\u0932\u094D\u092F\u093E\u092E\u0941\u0933\u0947, \u0936\u093F\u0915\u094D\u0937\u0923\u093E\u0935\u094D\u092F\u0924\u093F\u0930\u093F\u0915\u094D\u0924 \u0917\u0947\u092E \u0916\u0947\u0933\u0923\u0947, \u0935\u094D\u0939\u0949\u091F\u094D\u0938\u0905\u0945\u092A, \u0907\u0928\u094D\u0938\u094D\u091F\u093E\u0917\u094D\u0930\u093E\u092E, \u0930\u093F\u0932\u094D\u0938 \u092C\u0928\u0935\u093F\u0923\u0947 \u0906\u0923\u093F \u0938\u093E\u0924\u0924\u094D\u092F\u093E\u0928\u0947 \u092E\u094B\u092C\u093E\u0908\u0932 \u092A\u093E\u0939\u0923\u0947 \u0939\u0947 \u092A\u094D\u0930\u0915\u093E\u0930 \u0935\u093E\u0922\u0932\u0947. \u0924\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u092E\u0941\u0932\u0947 \u092E\u094B\u092C\u093E\u0908\u0932\u091A\u094D\u092F\u093E \u0906\u0939\u093E\u0930\u0940 \u0917\u0947\u0932\u0940. \u0938\u0924\u0924\u091A\u094D\u092F\u093E \u092E\u094B\u092C\u093E\u0908\u0932 \u0935\u093E\u092A\u0930\u093E\u092E\u0941\u0933\u0947 \u092E\u0941\u0932\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u091A\u093F\u0921\u091A\u093F\u0921, \u0928\u093F\u0930\u093E\u0936\u093E, \u092E\u093E\u0928\u0938\u093F\u0915 \u0924\u0923\u093E\u0935 \u0935\u093E\u0922\u0942 \u0932\u093E\u0917\u0932\u093E \u0906\u0923\u093F \u0924\u0947 \u0905\u092D\u094D\u092F\u093E\u0938\u093E\u092A\u093E\u0938\u0942\u0928 \u0926\u0942\u0930 \u091C\u093E\u0909 \u0932\u093E\u0917\u0932\u0947.</p>
      <p>\u0906\u091C\u091A\u0947 \u092F\u0941\u0917 \u0939\u0947 \u0938\u094D\u092A\u0930\u094D\u0927\u0947\u091A\u0947 \u092F\u0941\u0917 \u0906\u0939\u0947. \u0906\u092A\u0932\u093E \u092A\u093E\u0932\u094D\u092F \u092F\u093E \u0938\u094D\u092A\u0930\u094D\u0927\u0947\u091A\u094D\u092F\u093E \u092F\u0941\u0917\u093E\u0924 \u091F\u093F\u0915\u0923\u094D\u092F\u093E\u0938\u093E\u0920\u0940 \u0924\u094D\u092F\u093E\u0902\u091A\u094D\u092F\u093E\u0924 \u0936\u093E\u0932\u0947\u092F \u091C\u0940\u0935\u0928\u093E\u0924\u091A \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u0947\u091A\u0940 \u0906\u0935\u0921 \u0928\u093F\u0930\u094D\u092E\u093E\u0923 \u0939\u094B\u0923\u0947 \u0905\u0924\u094D\u092F\u0902\u0924 \u0906\u0935\u0936\u094D\u092F\u0915 \u0906\u0939\u0947. \u0936\u093E\u0932\u0947\u092F \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u0928\u093E \u0906\u091C \u0905\u0928\u0928\u094D\u092F\u0938\u093E\u0927\u093E\u0930\u0923 \u092E\u0939\u0924\u094D\u0924\u094D\u0935 \u092A\u094D\u0930\u093E\u092A\u094D\u0924 \u091D\u093E\u0932\u0947 \u0906\u0939\u0947. \u0917\u0947\u0932\u094D\u092F\u093E \u0915\u093E\u0939\u0940 \u0935\u0930\u094D\u0937\u093E\u0902\u092A\u093E\u0938\u0942\u0928 \u0909\u091A\u094D\u091A \u0936\u093F\u0915\u094D\u0937\u0923\u093E\u091A\u094D\u092F\u093E \u092A\u094D\u0930\u0935\u0947\u0936\u093E\u0938\u093E\u0920\u0940 \u0906\u0923\u093F \u092E\u0939\u0924\u094D\u0924\u094D\u0935\u093E\u091A\u094D\u092F\u093E \u092A\u0926\u093E\u0902\u0935\u0930 \u0928\u093F\u092F\u0941\u0915\u094D\u0924\u0940\u0938\u093E\u0920\u0940 \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E \u0905\u0928\u093F\u0935\u093E\u0930\u094D\u092F \u0939\u094B\u0924 \u091A\u093E\u0932\u0932\u094D\u092F\u093E \u0906\u0939\u0947\u0924. \u0924\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u092F\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u091A\u0940 \u092E\u093E\u0939\u093F\u0924\u0940 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u093E \u0936\u093E\u0932\u0947\u092F \u091C\u0940\u0935\u0928\u093E\u0924\u091A \u092E\u093F\u0933\u0923\u0947 \u0939\u0940 \u0915\u093E\u0933\u093E\u091A\u0940 \u0917\u0930\u091C \u092C\u0928\u0932\u0940 \u0906\u0939\u0947.</p>
      <p>\u0921\u0940.\u091C\u0940. \u0930\u093E\u0920\u094B\u0921 \u092B\u093E\u0909\u0902\u0921\u0947\u0936\u0928 \u0938\u0902\u091A\u0932\u093F\u0924 <strong>\u091C\u094D\u091E\u093E\u0928\u0938\u093F\u0926\u094D\u0927\u0940 \u0938\u094D\u0915\u0949\u0932\u0930 \u0905\u0915\u0945\u0921\u092E\u0940, \u0928\u0935\u0947\u0916\u0947\u0921 (DSA)</strong> \u092F\u093E \u0938\u0902\u0938\u094D\u0925\u0947\u091A\u094D\u092F\u093E \u092E\u093E\u0927\u094D\u092F\u092E\u093E\u0924\u0942\u0928 \u090F\u0915 \u0906\u0917\u0933\u093E\u0935\u0947\u0917\u0933\u093E \u092A\u0945\u091F\u0930\u094D\u0928 \u0930\u093E\u092C\u0935\u093F\u0923\u094D\u092F\u093E\u0924 \u0906\u0932\u093E \u0906\u0939\u0947.</p>
      <p>\u0936\u093E\u0932\u0947\u092F \u092A\u093E\u0920\u094D\u092F\u0915\u094D\u0930\u092E\u093E\u0936\u0940 \u0938\u0941\u0938\u0902\u0917\u0924 \u0905\u0936\u0940 \u0936\u093E\u0932\u0947\u092F \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u091A\u0940 \u0924\u092F\u093E\u0930\u0940, <strong>\u091C\u094D\u091E\u093E\u0928\u0938\u093F\u0926\u094D\u0927\u0940 \u0906\u0926\u0930\u094D\u0936 \u0917\u0941\u0930\u0941\u0915\u0941\u0932 \u0905\u0915\u0945\u0921\u092E\u0940, \u0906\u0937\u094D\u091F\u093E</strong> \u092F\u0947\u0925\u0940\u0932 \u0938\u0902\u091A\u093E\u0932\u0915 <strong>\u0936\u094D\u0930\u0940. \u090F\u0938.\u092A\u0940. \u0930\u093E\u0920\u094B\u0921</strong> \u0938\u0930 \u092F\u093E\u0902\u091A\u094D\u092F\u093E \u092E\u093E\u0930\u094D\u0917\u0926\u0930\u094D\u0936\u0928\u093E\u0916\u093E\u0932\u0940 \u0915\u0947\u0932\u0940 \u091C\u093E\u0924\u0947. \u0907\u092F\u0924\u094D\u0924\u093E \u091A\u094C\u0925\u0940\u092A\u093E\u0938\u0942\u0928 \u0926\u0939\u093E\u0935\u0940\u092A\u0930\u094D\u092F\u0902\u0924 \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u0947\u0936\u0940 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u091A\u0940 \u0928\u093E\u0933 \u091C\u094B\u0921\u0932\u0940 \u091C\u093E\u0924\u0947. \u0924\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u092D\u0935\u093F\u0937\u094D\u092F\u093E\u0924 \u0926\u094D\u092F\u093E\u0935\u094D\u092F\u093E \u0932\u093E\u0917\u0923\u093E\u0931\u094D\u092F\u093E <strong>JEE, NEET, CET, ARMY, NAVY, AIRFORCE, \u092A\u094B\u0932\u0940\u0938 \u092D\u0930\u0924\u0940</strong> \u0907\u0924\u094D\u092F\u093E\u0926\u0940 \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u0938\u093E\u0920\u0940 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u093E \u092E\u094B\u0920\u093E \u092B\u093E\u092F\u0926\u093E \u0939\u094B\u0924\u094B. \u0936\u093E\u0932\u0947\u092F \u091C\u0940\u0935\u0928\u093E\u0924 \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u0947\u091A\u0940 \u0924\u092F\u093E\u0930\u0940 \u091D\u093E\u0932\u094D\u092F\u093E\u092E\u0941\u0933\u0947 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u091A\u0940 \u092A\u0930\u0940\u0915\u094D\u0937\u0947\u0935\u093F\u0937\u092F\u0940\u091A\u0940 \u092D\u0940\u0924\u0940 \u0915\u092E\u0940 \u0939\u094B\u0924\u0947 \u0906\u0923\u093F \u0924\u0947 \u0932\u0935\u0915\u0930 \u092F\u0936\u0938\u094D\u0935\u0940 \u0939\u094B\u0924\u093E\u0924.</p>
      <p>\u092F\u093E \u0938\u0902\u0938\u094D\u0925\u0947\u091A\u094D\u092F\u093E \u092E\u093E\u0927\u094D\u092F\u092E\u093E\u0924\u0942\u0928 \u0907\u092F\u0924\u094D\u0924\u093E 1 \u0932\u0940 \u0924\u0947 8 \u0935\u0940 \u092A\u0930\u094D\u092F\u0902\u0924\u091A\u094D\u092F\u093E \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0938\u093E\u0920\u0940 \u0936\u093E\u0932\u0947\u092F \u0905\u092D\u094D\u092F\u093E\u0938\u0915\u094D\u0930\u092E\u093E\u092C\u0930\u094B\u092C\u0930\u091A <strong>\u091C\u0935\u093E\u0939\u0930 \u0928\u0935\u094B\u0926\u092F, \u0938\u093E\u0924\u093E\u0930\u093E \u0938\u0948\u0928\u093F\u0915 \u0936\u093E\u0933\u093E, \u091A\u0902\u0926\u094D\u0930\u092A\u0942\u0930 \u0938\u0948\u0928\u093F\u0915 \u0936\u093E\u0933\u093E, \u0917\u0923\u093F\u0924 \u092A\u094D\u0930\u093E\u0935\u093F\u0923\u094D\u092F, \u0936\u093F\u0937\u094D\u092F\u0935\u0943\u0924\u094D\u0924\u0940 \u092A\u0930\u0940\u0915\u094D\u0937\u093E, NMMS, RIMC</strong> \u0907\u0924\u094D\u092F\u093E\u0926\u0940 \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u091A\u0940 \u0924\u092F\u093E\u0930\u0940 \u0915\u0947\u0932\u0940 \u091C\u093E\u0924\u0947.</p>
      <p>\u0924\u0938\u0947\u091A \u0907\u092F\u0924\u094D\u0924\u093E 9 \u0935\u0940 \u0924\u0947 10 \u0935\u0940 \u092A\u0930\u094D\u092F\u0902\u0924\u091A\u094D\u092F\u093E \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0938\u093E\u0920\u0940 \u0936\u093E\u0932\u0947\u092F \u0905\u092D\u094D\u092F\u093E\u0938\u0915\u094D\u0930\u092E\u093E\u091A\u094D\u092F\u093E \u092A\u0930\u093F\u092A\u0942\u0930\u094D\u0923 \u0924\u092F\u093E\u0930\u0940\u092C\u0930\u094B\u092C\u0930\u091A <strong>MTSE, NTSE, SPI</strong> \u092F\u093E \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u091A\u0940 \u0906\u0923\u093F 12 \u0935\u0940 \u0928\u0902\u0924\u0930\u091A\u094D\u092F\u093E <strong>JEE, NEET, CET</strong> \u092F\u093E\u0902\u0938\u093E\u0930\u0916\u094D\u092F\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u091A\u0940 \u0924\u092F\u093E\u0930\u0940 <strong>Foundation Course</strong> \u091A\u094D\u092F\u093E \u092E\u093E\u0927\u094D\u092F\u092E\u093E\u0924\u0942\u0928 \u0915\u0947\u0932\u0940 \u091C\u093E\u0924\u0947. \u092F\u093E\u0924 <strong>Physics, Chemistry, Biology, Mathematics</strong> \u092F\u093E \u0935\u093F\u0937\u092F\u093E\u0902\u091A\u0940 \u092A\u0930\u093F\u092A\u0942\u0930\u094D\u0923 \u0924\u092F\u093E\u0930\u0940 \u0915\u0947\u0932\u0940 \u091C\u093E\u0924\u0947.</p>
      <p>\u0936\u094D\u0930\u0940. \u090F\u0938.\u092A\u0940. \u0930\u093E\u0920\u094B\u0921 \u0938\u0930 \u092F\u093E\u0902\u091A\u094D\u092F\u093E \u092E\u093E\u0930\u094D\u0917\u0926\u0930\u094D\u0936\u0928\u093E\u0916\u093E\u0932\u0940 \u0936\u093F\u0915\u0932\u0947\u0932\u0947 \u0905\u0928\u0947\u0915 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0906\u091C \u0936\u093E\u0938\u0915\u0940\u092F \u0935\u0948\u0926\u094D\u092F\u0915\u0940\u092F \u092E\u0939\u093E\u0935\u093F\u0926\u094D\u092F\u093E\u0932\u092F\u093E\u0924 <strong>MBBS</strong> \u0936\u093F\u0915\u094D\u0937\u0923 \u0918\u0947\u0924 \u0906\u0939\u0947\u0924, \u0915\u093E\u0939\u0940 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 <strong>\u0915\u094B\u091F\u093E (\u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928)</strong> \u092F\u0947\u0925\u0947 <strong>IIT</strong> \u091A\u0940 \u0924\u092F\u093E\u0930\u0940 \u0915\u0930\u0924 \u0906\u0939\u0947\u0924, \u0924\u0930 \u0915\u093E\u0939\u0940 \u0936\u093E\u0938\u0915\u0940\u092F \u0905\u092D\u093F\u092F\u093E\u0902\u0924\u094D\u0930\u093F\u0915\u0940 \u092E\u0939\u093E\u0935\u093F\u0926\u094D\u092F\u093E\u0932\u092F\u093E\u0902\u0924 \u0936\u093F\u0915\u094D\u0937\u0923 \u0918\u0947\u0924 \u0906\u0939\u0947\u0924.</p>
      <p>\u0915\u0947\u0935\u0933 \u0905\u092D\u094D\u092F\u093E\u0938\u0915\u094D\u0930\u092E \u092A\u0942\u0930\u094D\u0923 \u0915\u0930\u0942\u0928 \u0924\u094D\u092F\u093E\u091A\u0940 \u092A\u0930\u0940\u0915\u094D\u0937\u093E \u0918\u0947\u0923\u0947 \u0939\u093E \u0906\u092E\u091A\u093E \u0909\u0926\u094D\u0926\u0947\u0936 \u0928\u0938\u0942\u0928, \u0905\u092D\u094D\u092F\u093E\u0938\u0915\u094D\u0930\u092E\u093E\u0924\u0940\u0932 \u092E\u0942\u0932\u092D\u0942\u0924 \u0938\u0902\u0915\u0932\u094D\u092A\u0928\u093E \u0938\u092E\u091C\u0942\u0928 \u0918\u0947\u0909\u0928 \u0924\u094D\u092F\u093E \u0938\u094D\u092A\u0930\u094D\u0927\u093E \u092A\u0930\u0940\u0915\u094D\u0937\u093E\u0902\u092E\u0927\u094D\u092F\u0947 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u093E \u0915\u0936\u093E \u0909\u092A\u092F\u094B\u0917\u0940 \u092A\u0921\u0924\u0940\u0932, \u092F\u093E\u0915\u0921\u0947 \u0906\u092E\u094D\u0939\u0940 \u0905\u0927\u093F\u0915 \u0932\u0915\u094D\u0937 \u0926\u0947\u0924\u094B. \u0917\u094D\u0930\u093E\u092E\u0940\u0923 \u092D\u093E\u0917\u093E\u0924\u0940\u0932 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u093E \u0909\u091A\u094D\u091A \u0936\u093F\u0915\u094D\u0937\u0923 \u092E\u093F\u0933\u093E\u0935\u0947, \u0906\u0923\u093F \u0906\u092A\u0932\u0940 \u092E\u0941\u0932\u0947 \u0938\u094D\u0935\u093E\u0935\u0932\u0902\u092C\u0940 \u0935 \u0938\u094D\u0935\u0915\u0930\u094D\u0924\u0943\u0924\u094D\u0935\u0935\u093E\u0928 \u092C\u0928\u093E\u0935\u0940\u0924, \u092F\u093E \u0939\u0947\u0924\u0942\u0928\u0947 \u0936\u094D\u0930\u0940. \u090F\u0938.\u092A\u0940. \u0930\u093E\u0920\u094B\u0921 \u0938\u0930 \u092F\u093E\u0902\u0928\u0940 \u092F\u093E \u0938\u0902\u0938\u094D\u0925\u0947\u091A\u0940 \u0938\u094D\u0925\u093E\u092A\u0928\u093E \u0915\u0947\u0932\u0940. \u0917\u0947\u0932\u094D\u092F\u093E 14 \u0935\u0930\u094D\u0937\u093E\u0902\u092A\u093E\u0938\u0942\u0928 \u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u093E\u0924 \u0915\u093E\u092E \u0915\u0930\u0924\u093E\u0928\u093E \u0938\u0930\u093E\u0902\u091A\u094D\u092F\u093E \u092E\u093E\u0930\u094D\u0917\u0926\u0930\u094D\u0936\u0928\u093E\u0916\u093E\u0932\u0940 \u0939\u091C\u093E\u0930\u094B \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u092F\u0936\u0938\u094D\u0935\u0940 \u091D\u093E\u0932\u0947 \u0906\u0939\u0947\u0924.</p>
      <p>\u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u091A\u0940 \u0928\u093F\u0935\u0921 <strong>\u092C\u094C\u0926\u094D\u0927\u093F\u0915 \u091A\u093E\u091A\u0923\u0940 \u092A\u0930\u0940\u0915\u094D\u0937\u093E (CET)</strong> \u0918\u0947\u0909\u0928\u091A \u0915\u0947\u0932\u0940 \u091C\u093E\u0924\u0947. \u090F\u0915\u0942\u0923 150 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u094D\u092F\u093E\u0902\u0928\u093E \u092A\u094D\u0930\u0935\u0947\u0936 \u0926\u093F\u0932\u093E \u091C\u093E\u0924\u094B \u0906\u0923\u093F \u090F\u0915\u093E \u0935\u0930\u094D\u0917\u093E\u0924 \u092B\u0915\u094D\u0924 25 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0905\u0938\u0924\u093E\u0924. \u092E\u0939\u093E\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092D\u0930 \u091C\u093E\u0939\u093F\u0930\u093E\u0924 \u0928 \u0915\u0930\u0924\u093E \u0926\u0930\u0935\u0930\u094D\u0937\u0940 200 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u092A\u094D\u0930\u0924\u0940\u0915\u094D\u0937\u093E \u092F\u093E\u0926\u0940\u0924 \u0905\u0938\u0924\u093E\u0924. \u092F\u093E \u0935\u093E\u0922\u0924\u094D\u092F\u093E \u092E\u093E\u0917\u0923\u0940\u091A\u094D\u092F\u093E \u092A\u093E\u0930\u094D\u0936\u094D\u0935\u092D\u0942\u092E\u0940\u0935\u0930 \u0936\u0948\u0915\u094D\u0937\u0923\u093F\u0915 \u0935\u0930\u094D\u0937 2023-24 \u092A\u093E\u0938\u0942\u0928 <strong>\u091C\u094D\u091E\u093E\u0928\u0938\u093F\u0926\u094D\u0927\u0940 \u0906\u0926\u0930\u094D\u0936 \u0917\u0941\u0930\u0941\u0915\u0941\u0932 \u0905\u0915\u0945\u0921\u092E\u0940, \u0906\u0937\u094D\u091F\u093E (DAGA)</strong> \u0939\u0940 \u0928\u0935\u0940\u0928 \u0936\u093E\u0916\u093E \u0938\u0941\u0930\u0942 \u0915\u0930\u0923\u094D\u092F\u093E\u0924 \u0906\u0932\u0940 \u0906\u0939\u0947. \u092F\u093E \u0936\u093E\u0916\u0947\u0924 \u0928\u093F\u0935\u093E\u0938\u0940 \u0935 \u0905\u0928\u093F\u0935\u093E\u0938\u0940 \u0905\u0938\u0947 \u090F\u0915\u0942\u0923 160 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0936\u093F\u0915\u094D\u0937\u0923 \u0918\u0947\u0924 \u0906\u0939\u0947\u0924.</p>
      <p>\u0935\u0930\u0940\u0932 \u0938\u0930\u094D\u0935 \u092C\u093E\u092C\u0940 \u0932\u0915\u094D\u0937\u093E\u0924 \u0918\u0947\u0924\u093E \u0906\u092A\u0932\u094D\u092F\u093E \u092E\u0941\u0932\u093E\u0902\u091A\u0947 \u092D\u0935\u093F\u0937\u094D\u092F \u0909\u091C\u094D\u0935\u0932 \u092C\u0928\u0935\u0923\u094D\u092F\u093E\u0938\u093E\u0920\u0940 \u0906\u0923\u093F \u0924\u094D\u092F\u093E\u0902\u0928\u093E \u092D\u093E\u0935\u0940 \u092A\u094D\u0930\u0936\u093E\u0938\u0915\u0940\u092F \u0905\u0927\u093F\u0915\u093E\u0930\u0940 \u092C\u0928\u0935\u0923\u094D\u092F\u093E\u091A\u094D\u092F\u093E \u0926\u093F\u0936\u0947\u0928\u0947 \u092A\u093E\u0909\u0932 \u0909\u091A\u0932\u0923\u094D\u092F\u093E\u0938\u093E\u0920\u0940 <strong>\u091C\u094D\u091E\u093E\u0928\u0938\u093F\u0926\u094D\u0927\u0940 \u0938\u094D\u0915\u0949\u0932\u0930 \u0905\u0915\u0945\u0921\u092E\u0940\u0932\u093E \u092D\u0947\u091F \u0926\u094D\u092F\u093E \u0906\u0923\u093F \u092A\u094D\u0930\u0935\u0947\u0936 \u0928\u093F\u0936\u094D\u091A\u093F\u0924 \u0915\u0930\u093E</strong>. \u0906\u092E\u094D\u0939\u093E\u0932\u093E \u0916\u093E\u0924\u094D\u0930\u0940 \u0906\u0939\u0947 \u0915\u0940 \u092A\u094D\u0930\u0935\u0947\u0936 \u0918\u0947\u0924\u0932\u0947\u0932\u093E \u092A\u094D\u0930\u0924\u094D\u092F\u0947\u0915 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0909\u091C\u094D\u0935\u0932 \u092F\u0936 \u0938\u0902\u092A\u093E\u0926\u0928 \u0915\u0930\u0942\u0928\u091A \u092C\u093E\u0939\u0947\u0930 \u092A\u0921\u0947\u0932.</p>
      <p><strong>\u0906\u092A\u0932\u093E \u0928\u092E\u094D\u0930,</strong><br>
      \u0938\u0902\u091A\u093E\u0932\u0915,<br>
      \u091C\u094D\u091E\u093E\u0928\u0938\u093F\u0926\u094D\u0927\u0940 \u0938\u094D\u0915\u0949\u0932\u0930 \u0905\u0915\u0945\u0921\u092E\u0940 (DSA)<br>
      \u091C\u094D\u091E\u093E\u0928\u0938\u093F\u0926\u094D\u0927\u0940 \u0906\u0926\u0930\u094D\u0936 \u0917\u0941\u0930\u0941\u0915\u0941\u0932 \u0905\u0915\u0945\u0921\u092E\u0940 (DAGA)</p>
    `;
  </script>

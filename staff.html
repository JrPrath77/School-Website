<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Staff — DAGA Education</title>
  <meta name="description" content="Meet the dedicated educators and staff of DAGA Education (Dnyansiddhi Adarsh Gurukul Academy). Our teaching and non-teaching staff are committed to student excellence.">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/about.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/staff.css">
  <link rel="stylesheet" href="styles/dark-mode.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/lightbox.css">
  <link rel="stylesheet" href="styles/announcement-toast.css">
  <!-- Google Fonts for Marathi -->
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">

  <style>
    /* ─── Loading Spinner ─── */
    .staff-loading {
      text-align: center;
      padding: 80px 20px;
      color: #64748b;
    }
    .staff-spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid #e0e7ff;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Department section heading color support */
    .staff-section h2 {
      font-size: 26px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
  </style>
  <script src="js/config.js"></script>
</head>
<body>
  <!-- Header (injected by shared-header.js) -->
  <header id="header" class="header"></header>

  <!-- Staff Hero Banner -->
  <section class="staff-hero-banner">
    <div class="staff-hero-overlay"></div>
    <img src="images/staff-banner.jpg" alt="Staff Background" class="staff-bg-image">
    <div class="staff-hero-content">
      <h1 class="staff-heading">Meet Our Educators</h1>
      <p class="staff-quote">"शिक्षक म्हणजे ज्ञानाचे दीपस्तंभ; त्यांच्या प्रकाशात विद्यार्थ्यांचे भविष्य उजळते."</p>
    </div>
  </section>

  <!-- Dynamic Staff Container -->
  <div id="staff-dynamic-container">
    <!-- Loading state -->
    <section class="staff-section">
      <div class="staff-loading">
        <div class="staff-spinner"></div>
        <p>Loading staff information…</p>
      </div>
    </section>
  </div>

  <!-- Footer (injected by shared-footer.js) -->
  <footer class="footer"></footer>

  <!-- Chat Widget -->
  <div class="chat-widget" id="chat-widget">
    <button class="chat-toggle" id="chat-toggle">
      <span class="chat-toggle-icon">💬</span>
      <span class="chat-toggle-text">Need Help?</span>
    </button>
    <div class="chat-container" id="chat-container">
      <div class="chat-header">
        <h3>DAGA Education Assistant</h3>
        <button class="chat-close" id="chat-close">×</button>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-message bot">
          <div class="message-content">
            Hello! I'm your DAGA Education assistant. How can I help you today?
          </div>
        </div>
      </div>
      <div class="chat-input">
        <textarea id="chat-input-field" placeholder="Type your message..." rows="1"></textarea>
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

  <!-- Announcement Toast Popup -->
  <div id="announcement-toast" class="announcement-toast">
    <div class="toast-header">
      <span class="toast-title">📢 Announcement</span>
      <button id="toast-close" class="toast-close" aria-label="Close">×</button>
    </div>
    <p class="toast-date" id="toast-date"></p>
    <p class="toast-notice-title" id="toast-notice-title"></p>
    <p class="toast-text" id="toast-text"></p>
    <div class="toast-footer">
      <a id="toast-link" class="toast-link" href="#" style="display:none;">Read more →</a>
    </div>
    <div class="toast-progress"><div class="toast-progress-bar"></div></div>
  </div>

  <!-- Shared Components -->
  <script src="js/shared-header.js"></script>
  <script src="js/shared-footer.js"></script>
  <script src="js/dark-mode.js"></script>
  <script src="js/scroll-reveal.js"></script>
  <script src="js/announcement.js"></script>
  <script src="js/announcement-toast.js"></script>

  <script type="module" src="js/main.js"></script>
  <script src="js/chat.js"></script>
  <!-- Dynamic staff loader — fetches from /api/v1/staff -->
  <script src="js/staff-api.js"></script>
</body>
</html>
